<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<meta name="description" content="A simple action tracker for D&D characters">
<title>D&D Action Sheet</title>
<style>
:root{--bg:#0d0d0f;--card:#17171b;--ink:#e8e6ee;--mute:#8d8a99;--line:#2e2e36;--acc:#8b5cf6;--accink:#fff;--pip:#a78bfa;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,"Times New Roman",serif}
main{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:0}
h2{font-size:1.1rem;margin:18px 0 8px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button.pri{background:var(--acc);color:var(--accink);border-color:var(--acc)}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
header input{max-width:280px;font-weight:bold}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tab.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:10px;padding:12px}
.card h3{margin:0 0 2px;font-size:1.05rem}
.meta{color:var(--mute);font-size:.85rem}
.tag{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:0 8px;font-size:.78rem;margin:2px 4px 2px 0}
.desc{margin:6px 0;white-space:pre-wrap}
.pips{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
.pip{width:22px;height:22px;border-radius:50%;border:2px solid var(--pip);padding:0;background:var(--pip)}
.pip.used{background:transparent}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 120px}
form{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;display:none;gap:8px;flex-direction:column}
form.open{display:flex}
label{font-size:.82rem;color:var(--mute)}
.small{padding:3px 8px;font-size:.8rem}
.empty{color:var(--mute);text-align:center;padding:30px}
footer{margin-top:36px;padding-top:14px;border-top:1px solid var(--line);text-align:center;color:var(--mute);font-size:.85rem}
.bubble{display:inline-block;border:1px solid var(--acc);color:var(--pip);border-radius:99px;padding:1px 10px;font-size:.75rem;margin-left:8px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button:hover{border-color:var(--acc)}
.pt,.pt>thead,.pt>tbody,.pt>tfoot,.pt tr,.pt td{display:block;padding:0}.sp{display:none}@page{margin:0}
@media print{.noprint{display:none!important}body{background:#fff;color:#000;font-size:11px;line-height:1.3}main{max-width:none;padding:0 10mm}header{margin-bottom:6px}h1{font-size:1.1rem}header input{border:0;padding:0;max-width:none;background:transparent}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-items:start}.card{break-inside:avoid;page-break-inside:avoid;margin:0;padding:6px 8px;background:#fff;border-color:#999;-webkit-print-color-adjust:exact;print-color-adjust:exact}.card h3{font-size:.95rem}.desc{margin:2px 0}.pips{margin:2px 0}.pip{width:14px;height:14px;border-width:1.5px}.tag{font-size:.7rem;padding:0 6px;border:0;background:#eee;-webkit-print-color-adjust:exact;print-color-adjust:exact}footer{display:none}.pt{display:table;width:100%}.pt>thead{display:table-header-group}.pt>tbody{display:table-row-group}.pt>tfoot{display:table-footer-group}.pt tr{display:table-row}.pt td{display:table-cell}.sp{display:block;height:20mm}}
</style>
</head>
<body>
<main><table class="pt"><thead><tr><td><div class="sp"></div></td></tr></thead><tbody><tr><td>

<section id="home">
  <header><div><h1>⚔️ Action Sheet</h1><div class="meta">One sheet per character – pick one or start a new one</div></div></header>
  <div class="bar">
    <button class="pri" id="new">+ New sheet</button>
    <button id="exj">Export backup (JSON)</button>
    <button id="imp">Import backup</button>
    <input id="impf" type="file" accept=".json,application/json" style="display:none">
  </div>
  <form id="nf">
    <div class="row">
      <div><label>Character name</label><input id="nn" placeholder="e.g. Elara"></div>
      <div><label>Class / subclass (optional)</label><input id="nc" placeholder="e.g. Fighter (Champion)"></div>
      <div><label>Level</label><select id="nl"></select></div>
    </div>
    <div class="row"><button class="pri" type="submit">Create sheet</button><button type="button" id="ncancel">Cancel</button></div>
  </form>
  <h2>Your sheets</h2>
  <div class="grid" id="lists"></div>
</section>

<section id="view" hidden>
  <header>
    <div><h1>⚔️ Action Sheet</h1><div class="meta" id="vmeta"></div></div>
    <input id="lname" placeholder="Character name">
  </header>
  <div class="bar noprint">
    <button id="back">← All sheets</button>
    <button class="pri" id="add">+ New action</button>
    <button id="sr">☀️ Short rest</button>
    <button id="lr">🌙 Long rest</button>
    <button id="prt" title="In the print dialog, choose “Save as PDF” as the destination">Print / Save as PDF</button>
    <button id="pdf" title="Opens the print dialog. Choose &quot;Save as PDF&quot; as the destination.">Save as PDF</button>
    <button id="exm">Export list (Markdown)</button>
  </div>

  <form id="f" class="noprint">
    <div class="row">
      <div><label>Name</label><input id="n" required></div>
      <div><label>Action type</label><select id="t"></select></div>
      <div><label>Source</label>
        <select id="s"><option>General</option><option>Class</option><option>Race</option><option>Spell</option><option>Feat</option><option>Item</option><option>Weapon</option></select></div>
    </div>
    <div class="row">
      <div><label>Range / duration</label><input id="r" placeholder="e.g. 60 ft, concentration"></div>
      <div><label>Attack / saving throw</label><input id="a" placeholder="e.g. +7 or DEX save DC 15"></div>
      <div><label>Damage / effect</label><input id="d" placeholder="e.g. 1d8+4 slashing"></div>
    </div>
    <div class="row">
      <div><label>Uses (0 = unlimited)</label><input id="u" type="number" min="0" max="20" value="0"></div>
      <div><label>Recharges on</label><select id="rc"><option value="">–</option><option value="kurz">Short rest</option><option value="lang">Long rest</option></select></div>
    </div>
    <div><label>Description / notes</label><textarea id="ds" rows="3"></textarea></div>
    <div class="row"><button class="pri" type="submit">Save</button><button type="button" id="cancel">Cancel</button></div>
  </form>

  <div class="bar noprint" id="tabs"></div>
  <input id="q" class="noprint" placeholder="Search …" style="margin-bottom:10px">
  <div class="grid" id="list"></div>
</section>

<footer>Made by Ertreuer<span class="bubble">made with AI</span></footer>
</td></tr></tbody><tfoot><tr><td><div class="sp"></div></td></tr></tfoot></table></main>

<script>
var KEY="dnd-actions-v2",OLD="dnd-actions-v1";
var TYPES=["All","Action","Bonus Action","Reaction","Free Action","Movement","Other"];
var state={sheets:[]},curId=null,tab="All",editId=null;
function el(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function uid(){return Math.random().toString(36).slice(2)}
function S(){return state.sheets.filter(function(l){return l.id==curId})[0]}
function byId(id){return S().items.filter(function(i){return i.id==id})[0]}
function std(n,t,d){return{id:uid(),name:n,type:t,src:"General",range:"",atk:"",dmg:"",uses:0,used:0,rec:"",desc:d}}
function seed(){return[
 std("Attack","Action","Make one melee or ranged attack (more with Extra Attack)."),
 std("Dash","Action","Double your movement speed for this turn."),
 std("Disengage","Action","Your movement doesn’t provoke opportunity attacks."),
 std("Dodge","Action","Attacks against you have disadvantage; advantage on DEX saves."),
 std("Help","Action","Give an ally advantage on their next check or attack."),
 std("Hide","Action","Dexterity (Stealth) check against Perception."),
 std("Ready","Action","Choose a trigger and a response; uses your reaction."),
 std("Opportunity Attack","Reaction","Melee attack when a foe leaves your reach.")
]}
function load(){
 try{
  var r=localStorage.getItem(KEY);
  if(r){state=JSON.parse(r);if(!Array.isArray(state.sheets))state={sheets:[]};return}
  var o=localStorage.getItem(OLD);
  if(o){var d=JSON.parse(o);state.sheets=[{id:uid(),name:d.char||"My character",cls:"",level:1,items:d.items||[]}];save()}
 }catch(e){}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
el("t").innerHTML=TYPES.slice(1).map(function(t){return"<option>"+t+"</option>"}).join("");
el("nl").innerHTML=Array.apply(null,Array(20)).map(function(_,i){return'<option value="'+(i+1)+'">Level '+(i+1)+'</option>'}).join("");

/* ---------- home ---------- */
function renderHome(){
 el("home").hidden=false;el("view").hidden=true;
 el("lists").innerHTML=state.sheets.length?state.sheets.map(function(l){
  return'<div class="card"><h3>'+esc(l.name)+'</h3>'+(l.cls?'<span class="tag">'+esc(l.cls)+'</span>':'')+'<span class="tag">Level '+l.level+'</span><div class="meta">'+l.items.length+' action'+(l.items.length==1?'':'s')+'</div><div style="margin-top:8px"><button class="small pri" data-o="'+l.id+'">Open</button> <button class="small" data-d="'+l.id+'">Delete</button></div></div>'
 }).join(""):'<div class="empty">No sheets yet. Create your first one with “+ New sheet”.</div>';
}
el("new").onclick=function(){el("nn").value="";el("nc").value="";el("nl").value="1";el("nf").classList.add("open");el("nn").focus()};
el("ncancel").onclick=function(){el("nf").classList.remove("open")};
el("nf").onsubmit=function(e){
 e.preventDefault();
 var v=+el("nl").value,c=el("nc").value.trim();
 var l={id:uid(),name:el("nn").value.trim()||"New character",cls:c,level:v,items:seed()};
 state.sheets.push(l);save();el("nf").classList.remove("open");openSheet(l.id);
};
el("lists").onclick=function(e){
 var id;
 if(id=e.target.getAttribute("data-o"))openSheet(id);
 else if(id=e.target.getAttribute("data-d")){if(confirm("Really delete this sheet?")){state.sheets=state.sheets.filter(function(l){return l.id!=id});save();renderHome()}}
};

/* ---------- sheet view ---------- */
function openSheet(id){curId=id;tab="All";el("q").value="";el("f").classList.remove("open");render();window.scrollTo(0,0)}
el("back").onclick=function(){curId=null;renderHome()};
function render(){
 var l=S();if(!l){renderHome();return}
 el("home").hidden=true;el("view").hidden=false;
 el("lname").value=l.name;el("vmeta").textContent=(l.cls?l.cls+" · ":"")+"Level "+l.level;
 el("tabs").innerHTML=TYPES.map(function(t){var c=t=="All"?l.items.length:l.items.filter(function(i){return i.type==t}).length;return'<button class="tab'+(t==tab?' on':'')+'" data-t="'+t+'">'+t+' ('+c+')</button>'}).join("");
 var q=el("q").value.toLowerCase();
 var items=l.items.filter(function(i){return(tab=="All"||i.type==tab)&&(!q||(i.name+i.desc+i.src).toLowerCase().indexOf(q)>-1)});
 el("list").innerHTML=items.length?items.map(function(i){
  var pips="";
  if(i.uses>0){pips='<div class="pips">';for(var k=0;k<i.uses;k++)pips+='<button class="pip'+(k<i.used?' used':'')+'" data-p="'+i.id+'" data-k="'+k+'" aria-label="Use"></button>';pips+='</div>'}
  var m=[i.range,i.atk,i.dmg].filter(Boolean).map(esc).join(" · ");
  return'<div class="card"><h3>'+esc(i.name)+'</h3><span class="tag">'+esc(i.type)+'</span><span class="tag">'+esc(i.src)+'</span>'+(i.rec?'<span class="tag">↻ '+(i.rec=="kurz"?"Short":"Long")+' rest</span>':'')+(m?'<div class="meta">'+m+'</div>':'')+(i.desc?'<div class="desc">'+esc(i.desc)+'</div>':'')+pips+'<div class="noprint"><button class="small" data-e="'+i.id+'">Edit</button> <button class="small" data-x="'+i.id+'">Delete</button></div></div>'
 }).join(""):'<div class="empty">Nothing here yet. Add something with “+ New action”.</div>';
}
function openForm(it){
 editId=it?it.id:null;el("f").classList.add("open");
 el("n").value=it?it.name:"";el("t").value=it?it.type:(tab=="All"?"Action":tab);el("s").value=it?it.src:"General";
 el("r").value=it?it.range:"";el("a").value=it?it.atk:"";el("d").value=it?it.dmg:"";
 el("u").value=it?it.uses:0;el("rc").value=it?it.rec:"";el("ds").value=it?it.desc:"";
 el("n").focus();
}
el("add").onclick=function(){openForm(null)};
el("cancel").onclick=function(){el("f").classList.remove("open")};
el("f").onsubmit=function(e){
 e.preventDefault();
 var o={name:el("n").value.trim(),type:el("t").value,src:el("s").value,range:el("r").value,atk:el("a").value,dmg:el("d").value,uses:Math.max(0,parseInt(el("u").value)||0),rec:el("rc").value,desc:el("ds").value};
 if(!o.name)return;
 if(editId){var it=byId(editId),keep=it.used;Object.assign(it,o);it.used=Math.min(keep,it.uses)}
 else{o.id=uid();o.used=0;S().items.push(o)}
 save();el("f").classList.remove("open");render();
};
el("tabs").onclick=function(e){var t=e.target.getAttribute("data-t");if(t){tab=t;render()}};
el("q").oninput=render;
el("lname").oninput=function(){S().name=this.value;save()};
el("list").onclick=function(e){
 var b=e.target,id;
 if(id=b.getAttribute("data-p")){var it=byId(id),k=+b.getAttribute("data-k");it.used=(k<it.used)?k:k+1;save();render()}
 else if(id=b.getAttribute("data-e")){openForm(byId(id));window.scrollTo(0,0)}
 else if(id=b.getAttribute("data-x")){if(confirm("Really delete?")){S().items=S().items.filter(function(i){return i.id!=id});save();render()}}
};
function rest(kind){S().items.forEach(function(i){if(i.rec=="kurz"||(kind=="lang"&&i.rec=="lang"))i.used=0});save();render()}
el("sr").onclick=function(){rest("kurz")};
el("lr").onclick=function(){rest("lang")};
function doPrint(){tab="All";el("q").value="";render();var t=document.title;document.title=(S()?S().name+" - ":"")+"D&D Action Sheet";window.print();document.title=t}
el("prt").onclick=doPrint;el("pdf").onclick=doPrint;

/* ---------- export / import ---------- */
function dlLocal(name,data){
 try{var b=new Blob([data],{type:"text/plain;charset=utf-8"}),u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(u)},1000)}catch(e){alert("Export failed.")}
}
function dl(name,data){
 var p=(window.claude&&window.claude.use)?window.claude.use("downloads"):null;
 if(!p){dlLocal(name,data);return}
 p.then(function(d){if(!d){dlLocal(name,data);return}return d.save({filename:name,data:data})})
  .catch(function(e){if(!e||e.code!=="declined")alert("Export failed: "+((e&&e.message)||e))});
}
function fname(b,ext){b=String(b||"").replace(/[^\w\-]+/g,"-").replace(/^-+|-+$/g,"")||"dnd-actions";return b+"."+ext}
function md(){
 var l=S(),o="# "+l.name+"\n\n"+(l.cls?l.cls+" · ":"")+"Level "+l.level+"\n";
 TYPES.slice(1).forEach(function(t){
  var a=l.items.filter(function(i){return i.type==t});
  if(!a.length)return;
  o+="\n## "+t+"\n";
  a.forEach(function(i){
   var m=[i.range,i.atk,i.dmg].filter(Boolean).join(" · ");
   o+="\n- **"+i.name+"** ("+i.src+")"+(m?" – "+m:"")+(i.uses?" – "+i.uses+" use(s)"+(i.rec?", "+(i.rec=="kurz"?"short":"long")+" rest":""):"")+(i.desc?"\n  "+i.desc.replace(/\n/g,"\n  "):"");
  });
 });
 return o+"\n";
}
el("exj").onclick=function(){dl("dnd-action-sheets.json",JSON.stringify(state,null,2))};
el("exm").onclick=function(){dl(fname(S().name,"md"),md())};
el("imp").onclick=function(){el("impf").click()};
el("impf").onchange=function(){
 var f=this.files&&this.files[0];this.value="";
 if(!f)return;
 var r=new FileReader();
 r.onload=function(){
  try{
   var d=JSON.parse(r.result);
   if(d&&Array.isArray(d.items))d={sheets:[{id:uid(),name:d.char||"Imported character",cls:"",level:1,items:d.items}]};
   if(!d||!Array.isArray(d.sheets))throw new Error("bad file");
   if(!confirm("Replace all your sheets with the imported ones?"))return;
   state={sheets:d.sheets};curId=null;save();renderHome();
  }catch(e){alert("That file isn’t a valid backup.")}
 };
 r.readAsText(f);
};
load();renderHome();
</script>
</body>
</html>
